<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e4472e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#171515" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="#171515"/>
  <rect x="0" y="0" width="180" height="180" rx="36" fill="url(#glow)"/>
  <rect x="6" y="6" width="168" height="168" rx="30" fill="none" stroke="#e4472e" stroke-width="4" stroke-opacity="0.7"/>

  <!-- Dramatic Typographic HMO. mark -->
  <text x="84" y="118" font-family="Impact, 'Arial Narrow Bold', 'Arial Black', sans-serif" font-size="70" font-weight="900" text-anchor="middle" letter-spacing="-3" fill="#f5f0e6">HMO<tspan fill="#e4472e">.</tspan></text>
  
  <!-- Subtle candle flame / spark dot -->
  <circle cx="148" cy="46" r="6.5" fill="#f4c430"/>
</svg>
